{% extends "base.html" %}

{% block title %}Log Out{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-6 py-16">
    <div class="w-full max-w-sm flex flex-col gap-8 text-center">

        <div class="flex flex-col items-center gap-4">
            <div class="bg-base-200 border border-base-300 rounded-full w-20 h-20 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-9 h-9 text-base-content/40">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
                </svg>
            </div>
            <div class="flex flex-col gap-2">
                <h1 class="text-4xl font-black tracking-tight leading-none uppercase">
                    Log <span class="text-primary">out?</span>
                </h1>
                <p class="text-base-content/50 text-sm max-w-xs mx-auto">
                    You'll lose your active session. Your saved scores and profile stay safe.
                </p>
            </div>
        </div>

        <div class="card bg-base-200 border border-base-300 shadow-xl">
            <div class="card-body gap-4">
                <form method="POST" action="{% url 'account_logout' %}" class="flex flex-col gap-3">
                    {% csrf_token %}
                    <button type="submit"
                        class="btn btn-error btn-lg w-full uppercase font-black tracking-wide rounded-xl">
                        Yes, log me out
                    </button>
                </form>
                <a href="{{ request.META.HTTP_REFERER|default:'/' }}"
                    class="btn btn-ghost btn-lg w-full border border-base-300 uppercase font-black tracking-wide rounded-xl">
                    Cancel
                </a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
